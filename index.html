<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAR 轉 ZIP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1e21;--mute:#6b7280;--acc:#2563eb;--bd:#d1d5db;--ok:#16a34a;--err:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e26;--fg:#e8eaed;--mute:#9aa0aa;--acc:#60a5fa;--bd:#363b47}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 20px;font-size:.9rem}
#drop{display:block;background:var(--card);border:2px dashed var(--bd);border-radius:14px;padding:36px 16px;text-align:center;cursor:pointer;transition:.15s}
#drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
#drop b{color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;margin:14px 0}
input[type=password]{flex:1;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:1rem}
ul{list-style:none;padding:0;margin:0}
li{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem}
li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
li .s{color:var(--mute);font-size:.82rem;white-space:nowrap}
li .s.ok{color:var(--ok)}li .s.err{color:var(--err)}
a.dl,button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:.9rem;cursor:pointer;text-decoration:none}
button:disabled{opacity:.5;cursor:default}
footer{color:var(--mute);font-size:.8rem;margin-top:20px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>RAR 轉 ZIP</h1>
  <p class="sub">所有轉換都在你的瀏覽器本機完成，檔案不會上傳到任何伺服器。</p>

  <label id="drop" for="file"><b>點擊選擇</b>或把 .rar 檔案拖曳到這裡<br><small style="color:var(--mute)">可一次選多個檔案</small></label>
  <input id="file" type="file" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">

  <div class="row">
    <input id="pwd" type="password" placeholder="若 RAR 有加密，請輸入密碼（選填）">
  </div>

  <ul id="list"></ul>
  <footer>支援 RAR 4 / RAR 5（不支援分卷壓縮）</footer>
</main>

<script>
let createExtractorFromData;

const drop = document.getElementById('drop');
const input = document.getElementById('file');
const list = document.getElementById('list');
const pwd = document.getElementById('pwd');
let wasmPromise;

const getWasm = () => { if (!wasmPromise) wasmPromise = fetch('./unrar.wasm').then(r => r.arrayBuffer()); return wasmPromise; };
async function loadEngine() {
  if (!createExtractorFromData) createExtractorFromData = (await import('./unrar.bundle.js')).createExtractorFromData;
}
const fmt = n => n > 1048576 ? (n/1048576).toFixed(1)+' MB' : (n/1024).toFixed(0)+' KB';

input.onchange = () => { handle([...input.files]); input.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle([...e.dataTransfer.files]); };

function handle(files) {
  if (!files.length) return;
  const rars = files.filter(f => /\.rar$/i.test(f.name));
  if (!rars.length) alert('請選擇 .rar 檔案');
  rars.forEach(convert);
}

async function convert(file) {
  const li = document.createElement('li');
  li.innerHTML = '<span class="n"></span><span class="s">轉換中…</span>';
  li.querySelector('.n').textContent = file.name;
  const status = li.querySelector('.s');
  list.prepend(li);

  try {
    await loadEngine();
    const [wasmBinary, buf] = await Promise.all([getWasm(), file.arrayBuffer()]);
    const extractor = await createExtractorFromData({
      wasmBinary, data: new Uint8Array(buf), password: pwd.value
    });
    const zip = new JSZip();
    let count = 0;
    for (const f of extractor.extract().files) {
      const h = f.fileHeader;
      const name = h.name.replace(/\\/g, '/');
      if (h.flags.directory) { zip.folder(name); continue; }
      if (!f.extraction?.data) continue;
      zip.file(name, f.extraction.data, { date: new Date(h.time) });
      count++;
    }
    const blob = await zip.generateAsync(
      { type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
      m => status.textContent = `壓縮中 ${m.percent.toFixed(0)}%`
    );
    const a = document.createElement('a');
    a.className = 'dl';
    a.href = URL.createObjectURL(blob);
    a.download = file.name.replace(/\.rar$/i, '') + '.zip';
    a.textContent = `下載 (${count} 個檔案, ${fmt(blob.size)})`;
    status.replaceWith(a);
  } catch (e) {
    status.classList.add('err');
    const msg = String(e.message || e);
    status.textContent = /password/i.test(msg) ? '需要正確密碼' : '失敗：' + msg;
  }
}
</script>
</body>
</html>
